<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPath – Weekly Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;700&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylecalendar.css">
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 12l18-6 18 6-18 6z"/><path d="M12 17v10c0 3 6 6 12 6s12-3 12-6V17"/><path d="M42 12v14"/>
    </svg>
    StudyPath
  </div>
  <nav aria-label="Main">
    <button class="btn">MAP</button>
    <button class="btn">GROUP WORK</button>
    <button class="btn">IMPORT</button>
  </nav>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" placeholder="Search..." aria-label="Search events">
  </label>
  <button class="menu" aria-label="Menu (1 notification)">
    <svg viewBox="0 0 60 49" fill="currentColor"><rect y="10" width="51" height="5" rx="2"/><rect y="27" width="51" height="5" rx="2"/><rect y="44" width="51" height="5" rx="2"/></svg>
  </button>
</header>

<main>
  <div class="scroll"><div class="cal" id="cal" role="grid" aria-label="Week of October 14"></div></div>
</main>

<footer>
  <div class="legend">
    <span style="--c:var(--class)"><i></i>Class</span>
    <span style="--c:var(--si)"><i></i>SI session</span>
    <span style="--c:var(--group)"><i></i>Group study</span>
    <span style="--c:var(--exam)"><i></i>Exam</span>
    <span style="--c:var(--personal)"><i></i>Personal</span>
  </div>
  <span>BETA 1 – Made October 1st, 2026</span>
</footer>

<script>
const DAYS  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DATES = [14,15,16,17,18,19,20];
const TODAY = 2; // Tuesday the 16th

// day: 0=Sun … 6=Sat · s/e = start/end in 24h decimal hours
const EVENTS = [
  { day:0, s:9.5,  e:13.5, title:"Church",                 place:"",                    type:"personal" },
  { day:1, s:9.5,  e:10.5, title:"CHEM1307",               place:"Chem Building, 049",  type:"class" },
  { day:1, s:11,   e:12.5, title:"POLS2013",               place:"COMC Building, 248",  type:"class" },
  { day:1, s:14,   e:15.5, title:"ENGR1340",               place:"Holden Hall, 038",    type:"class" },
  { day:2, s:11.5, e:13,   title:"SI Session CHEM1307",    place:"Chem Building, 121",  type:"si" },
  { day:3, s:9.5,  e:10.5, title:"CHEM1307",               place:"Chem Building, 049",  type:"class" },
  { day:3, s:11,   e:12.5, title:"Group Study ENGR1340",   place:"Holden Hall, 038",    type:"group" },
  { day:3, s:14,   e:15.5, title:"ENGR1340",               place:"Holden Hall, 038",    type:"class" },
  { day:4, s:11.5, e:13,   title:"SI Session CHEM1307",    place:"Chem Building, 121",  type:"si" },
  { day:5, s:9.5,  e:10.5, title:"CHEM1307",               place:"Chem Building, 049",  type:"class" },
  { day:5, s:12,   e:13.5, title:"Exam CHEM1307",          place:"Biology Building LH100", type:"exam" },
  { day:5, s:14,   e:15.5, title:"ENGR1340",               place:"Holden Hall, 038",    type:"class" },
  { day:6, s:10,   e:14,   title:"Cultural Fest TTU",      place:"Memorial Circle",     type:"personal" },
];

const START = 9, HOURS = 8;
const hourLabel = h => (h % 12 || 12) + (h < 12 ? "am" : "pm");
const cal = document.getElementById("cal");
const frag = document.createDocumentFragment();
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html) n.innerHTML = html; return n; };

// header row
frag.append(el("div", "head"));
DAYS.forEach((d, i) => {
  const h = el("div", "head" + (i === TODAY ? " today" : ""), `<div class="dow">${d}</div><div class="num">${DATES[i]}</div>`);
  h.setAttribute("role", "columnheader");
  if (i === TODAY) h.setAttribute("aria-current", "date");
  frag.append(h);
});

// time gutter
const times = el("div", "times");
for (let i = 0; i < HOURS; i++) {
  const s = el("span", "", hourLabel(START + i));
  s.style.top = `calc(var(--hour) * ${i})`;
  if (i) times.append(s);           // skip label at very top edge
}
frag.append(times);

// day columns
DAYS.forEach((_, i) => {
  const col = el("div", "col" + (i === TODAY ? " today" : ""));
  col.setAttribute("role", "gridcell");
  EVENTS.filter(ev => ev.day === i).forEach(ev => {
    const a = el("article", "event", `<b>${ev.title}</b>${ev.place ? `<small>${ev.place}</small>` : ""}`);
    a.style.cssText = `--s:${ev.s};--e:${ev.e};--c:var(--${ev.type})`;
    a.tabIndex = 0;
    a.title = `${ev.title}${ev.place ? " – " + ev.place : ""}`;
    col.append(a);
  });
  frag.append(col);
});
cal.append(frag);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styleschats.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">
      StudyPath
      <svg viewBox="0 0 24 24" fill="#111" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z"/></svg>
    </div>
    <nav class="nav" aria-label="Main">
      <button type="button">MAP</button>
      <button type="button">CALENDAR</button>
      <button type="button">IMPORT</button>
    </nav>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>
      <input type="search" placeholder="Search..." aria-label="Search">
    </label>
    <button class="menu" type="button" aria-label="Menu, new notifications">
      <svg viewBox="0 0 30 30" stroke="#555" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M3 7h24M3 15h24M3 23h24"/></svg>
      <span class="dot"></span>
    </button>
  </header>

  <div class="main">
    <aside class="rail" aria-label="Subjects">
      <button type="button" aria-label="English">
        <svg viewBox="0 0 50 50" aria-hidden="true"><rect x="8" y="6" width="34" height="38" rx="3" fill="#6aa6d8"/><rect x="14" y="14" width="22" height="14" fill="#f2b94a" stroke="#555" stroke-width="1"/><text x="25" y="25" font-size="9" text-anchor="middle" fill="#333" font-family="Poppins, Arial, sans-serif">ENG</text><rect x="8" y="40" width="34" height="4" fill="#c9553d"/></svg>
      </button>
      <button type="button" aria-label="Math">
        <svg viewBox="0 0 50 50" aria-hidden="true"><rect x="3" y="3" width="44" height="44" rx="9" fill="#111"/><g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M14 13v10M9 18h10"/><path d="M31 18h10"/><path d="M10 34h8M10 40h8"/><path d="M31 33l8 8M39 33l-8 8"/></g></svg>
      </button>
      <button type="button" aria-label="Science">
        <svg viewBox="0 0 50 50" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="22" cy="8" r="3"/><circle cx="31" cy="4" r="2"/><path d="M18 14h14M20 14v10L6 44a2 2 0 0 0 2 3h34a2 2 0 0 0 2-3L30 24V14"/><path d="M14 38h22" /></svg>
      </button>
      <button type="button" aria-label="Study">
        <svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="14" r="8" fill="#f2c9a0" stroke="#111" stroke-width="1.5"/><path d="M17 11q8-8 16 0z" fill="#3a2a22"/><rect x="14" y="22" width="22" height="18" rx="2" fill="#f26a21" stroke="#111" stroke-width="1.5"/><path d="M25 24v16" stroke="#111" stroke-width="1.5"/><path d="M6 26v8M44 26v8M9 22v4M41 22v4" stroke="#3b6fd8" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" aria-label="Coding">
        <svg viewBox="0 0 50 50" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="44" height="38" rx="5"/><path d="M3 15h44"/><circle cx="9" cy="10.5" r="1.2" fill="#111"/><circle cx="14" cy="10.5" r="1.2" fill="#111"/><circle cx="19" cy="10.5" r="1.2" fill="#111"/><path d="m19 24-6 6 6 6M31 24l6 6-6 6M27 22l-4 16"/></svg>
      </button>
    </aside>

    <section class="left board" aria-label="Notes from learning assistants">
      <span class="tag la-tag">Verified LA</span>
      <div class="card red la-card"></div>
      <div class="card stack-lime"></div>
      <div class="card stack-red"></div>
      <div class="card stack-green"></div>
    </section>

    <section class="right" aria-label="Student notes">
      <div class="board">
        <span class="tag st-tag-1">Verified Student</span>
        <div class="card green st-1"></div>
        <span class="tag st-tag-2">Verified Student</span>
        <div class="card st-2"></div>
      </div>
      <button class="note" type="button">Add Stack Note......</button>
    </section>
  </div>

  <footer class="foot">BETA 1 - Made in October 1st, 2026</footer>
</div>
</body>
</html>
